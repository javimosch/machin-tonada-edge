<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tonada-edge — fleet</title>
<style>
  :root { --bg:#0b0d12; --card:#141821; --line:#232a38; --txt:#e8ecf3; --dim:#8b94a7; --acc:#3fd8e0; --ok:#7ee787; --warn:#ffb454; --bad:#ff5b4d; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--txt); font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; padding:26px; max-width:1200px; margin:0 auto; }
  header { display:flex; align-items:baseline; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  h1 { font-size:19px; letter-spacing:.12em; }
  h1 span { color:var(--acc); }
  #summary { color:var(--dim); font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:16px; }
  .zone { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .z-head { display:flex; justify-content:space-between; align-items:center; }
  .z-name { font-weight:700; font-size:14px; }
  .z-sub { color:var(--dim); font-size:11px; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .dot.off { background:var(--bad); }
  .z-clock { font-size:18px; color:var(--dim); }
  .np { margin:12px 0 4px; font-size:16px; font-weight:600; }
  .np small { font-weight:400; color:var(--dim); font-size:11px; }
  .ebar { height:5px; background:#1c2230; border-radius:3px; margin:8px 0; overflow:hidden; }
  .ebar i { display:block; height:100%; background:linear-gradient(90deg,#3fd8e0,#e0489a); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .chip { font-size:10px; padding:2px 8px; border:1px solid var(--line); border-radius:99px; color:var(--dim); }
  .chip.src-cache { color:var(--warn); border-color:#b07a2a55; }
  .reason { color:var(--dim); font-size:11px; min-height:2em; margin:6px 0 10px; }
  canvas { width:100%; height:34px; display:block; }
  .ctl { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; display:grid; grid-template-columns:auto 1fr auto; gap:6px 10px; align-items:center; }
  .ctl label { color:var(--dim); font-size:11px; }
  .ctl output { font-size:11px; min-width:38px; text-align:right; }
  input[type=range] { accent-color:var(--acc); width:100%; }
  select { background:#0e1219; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:2px 6px; font:inherit; font-size:11px; }
  .none { color:var(--dim); }
  footer { margin-top:22px; color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>tonada<span>·</span>edge <span style="color:var(--dim);font-weight:400">fleet</span></h1>
  <div id="summary">connecting…</div>
</header>
<div class="grid" id="grid"></div>
<footer>live heartbeats from tonada-edge daemons · bkn control plane · signals drive the real decision engine · <a href="https://github.com/javimosch/machin-tonada-edge" style="color:inherit">source on github</a></footer>
<script>
const API = new URLSearchParams(location.search).get('api') || 'http://localhost:8470';
// Hart mode: daemon injects window.HART_DATA (fleet JSON pushed by `hart refresh
// --url <bkn hook>`) + a poller that fires `hart:data` on updates. Read-only:
// strict CSP, no fetch to the control plane at all.
const HART = typeof window.HART_DATA !== 'undefined';
let hartFleet = Array.isArray(window.HART_DATA) ? window.HART_DATA : null;
addEventListener('hart:data', e => { if (Array.isArray(e.detail)) { hartFleet = e.detail; paint(); } });
const grid = document.getElementById('grid');
const charts = {};
const MOOD = { calm:'#35c8d0', warm:'#ffb454', bright:'#7ee787', driving:'#e0489a', celebratory:'#ffd24d', late:'#4d6bff' };

function localTime(tz) {
  const d = new Date(Date.now() + tz * 3600e3);
  return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0');
}

async function j(url, opt) { const r = await fetch(API + url, opt); return r.ok ? r.json() : null; }

function zoneCard(z) {
  const el = document.createElement('div'); el.className = 'zone'; el.id = 'z-' + z.id;
  el.innerHTML = `
    <div class="z-head"><div><span class="dot off"></span><a class="z-name" style="color:inherit" href="https://hart.intrane.fr/a/javimosch/tonada-box?zone=${z.id}">${z.name}</a>
      <div class="z-sub">${z.brand} · ${z.city}, ${z.country}</div></div>
      <div class="z-clock" data-clock="${z.tz_off}">${localTime(z.tz_off)}</div></div>
    <div class="np none">no heartbeat yet</div>
    <div class="ebar"><i style="width:0%"></i></div>
    <div class="chips"></div>
    <div class="reason"></div>
    <canvas width="320" height="34"></canvas>
    <div class="ctl">
      <label>weather</label><select data-f="weather"><option>clear</option><option>clouds</option><option>rain</option><option>snow</option></select><output></output>
      <label>traffic</label><input type="range" min="0" max="100" data-f="occ"><output data-o="occ"></output>
      <label>POS/hr</label><input type="range" min="0" max="40" data-f="pos"><output data-o="pos"></output>
    </div>`;
  if (HART) el.querySelector('.ctl').style.display = 'none'; // read-only under strict CSP
  else el.querySelectorAll('[data-f]').forEach(c => c.addEventListener('input', () => pushSignals(z.id, el)));
  return el;
}

async function pushSignals(zid, el) {
  const body = JSON.stringify({
    occupancy: +el.querySelector('[data-f=occ]').value / 100,
    pos_rate: +el.querySelector('[data-f=pos]').value,
    weather: el.querySelector('[data-f=weather]').value,
    event: 0 });
  await fetch(API + '/api/v1/zone/signals?id=' + zid, { method:'POST', body });
}

function drawSpark(id, rows) {
  const c = charts[id]; if (!c) return;
  const x = c.getContext('2d'); x.clearRect(0,0,c.width,c.height);
  if (!rows || !rows.length) return;
  const pts = rows.slice().reverse();
  x.strokeStyle = '#3fd8e0'; x.lineWidth = 1.5; x.beginPath();
  pts.forEach((p,i) => { const px = i/(Math.max(1,pts.length-1))*c.width, py = c.height - p.energy*c.height; i?x.lineTo(px,py):x.moveTo(px,py); });
  x.stroke();
}

async function paint() {
  let fleet;
  if (HART) fleet = hartFleet;
  else { try { fleet = await j('/api/v1/fleet'); } catch { fleet = null; } }
  if (!fleet) { document.getElementById('summary').textContent = HART ? 'waiting for fleet data…' : 'control plane unreachable @ ' + API; return; }
  const on = fleet.filter(z => z.online).length;
  document.getElementById('summary').textContent = `${on}/${fleet.length} zones live · ${HART ? 'bkn → hart data push' : API}`;
  for (const z of fleet) {
    let el = document.getElementById('z-' + z.id);
    if (!el) { el = zoneCard(z); grid.appendChild(el); charts[z.id] = el.querySelector('canvas');
      el.querySelector('[data-f=weather]').value = z.weather || 'clear';
      el.querySelector('[data-f=occ]').value = Math.round((z.occupancy||0)*100);
      el.querySelector('[data-f=pos]').value = z.pos_rate||0; }
    el.querySelector('.dot').className = 'dot ' + (z.online ? 'on' : 'off');
    const np = el.querySelector('.np');
    if (z.track) { np.className = 'np'; np.innerHTML = `♪ ${z.title} <small>${z.mood} · ${z.bpm}bpm</small>`; }
    el.querySelector('.ebar i').style.width = (z.energy*100) + '%';
    el.querySelector('.chips').innerHTML =
      `<span class="chip">${z.weather||'—'}</span><span class="chip">occ ${(z.occupancy*100||0)|0}%</span>` +
      `<span class="chip">pos ${z.pos_rate|0}/hr</span><span class="chip ${z.source==='cache'?'src-cache':''}">${z.source||'—'}</span>`;
    el.querySelector('.reason').textContent = z.reason || '';
    el.querySelector('[data-o=occ]').textContent = Math.round((z.occupancy||0)*100) + '%';
    el.querySelector('[data-o=pos]').textContent = z.pos_rate|0;
    if (HART) drawSpark(z.id, z.hist || []);
    else j('/api/v1/zone/history?id=' + z.id).then(h => drawSpark(z.id, h));
  }
  document.querySelectorAll('[data-clock]').forEach(c => c.textContent = localTime(+c.dataset.clock));
}
paint();
setInterval(paint, 3000); // re-renders clocks; fleet data refreshes via hart:data / fetch
</script>
</body>
</html>
